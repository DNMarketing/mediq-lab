# Netlify-Deploy-Konfiguration für medIQ lab
# Next.js wird per `output: "export"` statisch nach ./out gebaut.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Kein SPA-Fallback ("/* /index.html 200"): Der statische Export erzeugt jede Route als
# /pfad/index.html. Unbekannte Adressen liefern so out/404.html mit echtem Status 404
# statt der Startseite mit 200 (Soft 404).
